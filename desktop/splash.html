<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>NullChat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-app-region: drag; }
  body {
    font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace;
    background: #060608; color: #d8dbe0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    border-radius: 12px;
  }
  .logo { width: 96px; height: 96px; position: relative; animation: bob 1.8s ease-in-out infinite; }
  .logo img { width: 100%; height: 100%; border-radius: 22px; box-shadow: 0 10px 44px rgba(194,255,61,.28); }
  .ring { position: absolute; inset: -10px; border-radius: 30px; border: 3px solid transparent; border-top-color: #c2ff3d; animation: spin 1.1s linear infinite; }
  .status { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8b919c; min-height: 18px; text-align: center; padding: 0 16px; }
  .bar { width: 160px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; visibility: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: #c2ff3d; transition: width .2s; }
  .tip { position: absolute; bottom: 16px; font-size: 11px; color: #5b616c; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
</style>
</head>
<body>
  <div class="logo"><div class="ring"></div><img src="build/icon.png" alt="" /></div>
  <div class="status" id="status">Starting…</div>
  <div class="bar" id="bar"><span id="fill"></span></div>
  <div class="tip" id="version"></div>
  <script src="splash.js"></script>
</body>
</html>
