# Builds the NullChat phone apps on GitHub's servers, so you don't need Android Studio, Xcode or a Mac for the Android app.
# Run it from the "Actions" tab: Build phone apps → Run workflow → pick Android, iPhone or both. The full walkthrough is docs/PHONE_APPS.md.
#
#   Android  Works with no setup: you get an app you can install on your own phone (debug-signed APK).
#            Add the optional secrets below to also get a release APK + AAB signed with your own key (what Google Play wants),
#            and the Firebase file so the app can receive notifications.
#   iPhone   Needs a paid Apple Developer account and the four APPLE_/ASC_ secrets below; it builds the app and uploads it to TestFlight.
#            EXPERIMENTAL: written from Apple's and Capacitor's documentation but never run, so the first run may need a fix. See docs/PHONE_APPS.md.
#
# Repository variable (Settings → Secrets and variables → Actions → Variables), the same one the desktop build uses:
#   NULLCHAT_SERVER_URL   your server, e.g. https://nullchat.fly.dev (otherwise the address in mobile/nullchat-app.json / fly.toml is used)
# Optional repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   GOOGLE_SERVICES_JSON       the whole text of google-services.json from your Firebase project (Android notifications)
#   ANDROID_KEYSTORE_BASE64    your release keystore (.jks) encoded as base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   (iPhone: App Store Connect API key; not the same file as the notification key on your server)
name: Build phone apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, both]
        default: android

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NULLCHAT_SERVER_URL: ${{ vars.NULLCHAT_SERVER_URL }}
      # Google Play and Android refuse an update whose build number isn't higher than the last one; the run number always is.
      NULLCHAT_VERSION_CODE: ${{ github.run_number }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8's Android project is built for Java 21
      - run: npm install --no-audit --no-fund
      - name: Add the Firebase file (notifications)
        if: env.HAS_FIREBASE == 'true'
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Add the release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nullchat-release.jks"
          echo "NULLCHAT_KEYSTORE=$RUNNER_TEMP/nullchat-release.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Create the Android project
        run: npm run android:add
      - name: Build the installable app (debug-signed APK)
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Build the signed release (APK and AAB)
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease bundleRelease
        working-directory: mobile/android
        env:
          NULLCHAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NULLCHAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NULLCHAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: NullChat-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NULLCHAT_SERVER_URL: ${{ vars.NULLCHAT_SERVER_URL }}
      NULLCHAT_VERSION_CODE: ${{ github.run_number }} # TestFlight also needs a higher build number for every upload
    steps:
      - name: Check the Apple secrets are there
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::The repository secret $v is missing. See docs/PHONE_APPS.md, the iPhone section."; missing=1; fi
          done
          exit $missing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create the iPhone project
        run: npm run ios:add
      - name: Archive and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NullChat.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NullChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
