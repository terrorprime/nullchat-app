<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NullChat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #040405; color: #e8e8ec;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  main { max-width: 22rem; text-align: center; }
  svg { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #a0a0ab; }
  button {
    font: inherit; font-weight: 600; color: #060608; background: #c2ff3d; border: 0; border-radius: 10px;
    min-height: 48px; padding: 0 28px; cursor: pointer;
  }
  button:active { opacity: .85; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  small { display: block; margin-top: 20px; color: #6f6f7a; word-break: break-all; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#c2ff3d" stroke-width="4.5" stroke-linecap="round"><circle cx="24" cy="24" r="14"/><path d="M10 38 38 10"/></g></svg>
  <h1>Can't reach NullChat</h1>
  <p>Check your internet connection, then try again. If it keeps happening, your server may be down for a moment.</p>
  <button id="retry" type="button">Try again</button>
  <small id="where"></small>
</main>
<script src="nullchat-server.js"></script>
<script>
  (function () {
    var server = window.NULLCHAT_SERVER;
    var where = document.getElementById('where');
    if (server) where.textContent = server;
    document.getElementById('retry').addEventListener('click', function () {
      if (server) location.href = server; else location.reload();
    });
    // Come back on its own as soon as the phone is online again.
    window.addEventListener('online', function () { if (server) location.href = server; });
  })();
</script>
</body>
</html>
